name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Create Debug Keystore
      run: |
        keytool -genkey -v -keystore debug.keystore \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -alias androiddebugkey \
          -keypass android \
          -storepass android \
          -dname "CN=Android Debug,O=Android,C=US"
    
    - name: Build Debug APK with Gradle
      run: gradle assembleDebug --no-daemon
    
    - name: Extract APK Version
      id: version
      run: |
        VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | grep -oP '"\K[^"]+')
        VERSION_CODE=$(grep 'versionCode' app/build.gradle.kts | grep -oP '= \K[0-9]+')
        echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
        echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
        echo "APK Version: $VERSION_NAME (Build: $VERSION_CODE)"
    
    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LocalTube-APK-v${{ steps.version.outputs.version_name }}
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Create Release Summary
      run: |
        echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "- **Version**: ${{ steps.version.outputs.version_name }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Build Code**: ${{ steps.version.outputs.version_code }}" >> $GITHUB_STEP_SUMMARY
        echo "- **APK Path**: app/build/outputs/apk/debug/app-debug.apk" >> $GITHUB_STEP_SUMMARY
